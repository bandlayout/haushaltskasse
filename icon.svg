<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="core" cx="50%" cy="38%" r="60%"><stop offset="0" stop-color="#2A0F5C"/><stop offset="1" stop-color="#140629"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="plusglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b1"/><feFlood flood-color="#00E5FF"/><feComposite in2="b1" operator="in" result="c1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b2"/><feFlood flood-color="#FF2BD6"/><feComposite in2="b2" operator="in" result="c2"/>
      <feMerge><feMergeNode in="c2"/><feMergeNode in="c1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#F2F4F7"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#ring)" stroke-width="22" filter="url(#halo)" opacity=".75"/>
  <circle cx="256" cy="256" r="186" fill="url(#core)" stroke="url(#ring)" stroke-width="14"/>
  <path d="M256 160v192M160 256h192" stroke="#fff" stroke-width="30" stroke-linecap="round" filter="url(#plusglow)"/>
</svg>
